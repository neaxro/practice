[defaults]

inventory = inventory/local/hosts.yaml
remote_user = ansible
become_user = ansible
roles_path = roles
forks = 5
stdout_callback = yaml
host_key_checking = False
become_password_file = ansible_password

# Enable persistent SSH connections for performance improvement
transport = smart
pipelining = True

[ssh_connection]
# Fine-tune SSH connection settings for better performance
control_path = ~/.ssh/ansible-%%h-%%p-%%r
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PubkeyAuthentication=no
timeout = 30

[callback_whitelist]
# Enable additional callbacks for better insights
enabled = timer, profile_tasks
