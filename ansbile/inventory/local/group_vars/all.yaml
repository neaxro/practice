    gid: 10000
    users: []
  - name: films_rw
    gid: 10001
    users: []

  - name: s3_ro
    gid: 10002
    users: []
  - name: s3_rw
    gid: 10003
    users: []

  - name: isos_ro
    gid: 10004
    users: []
  - name: isos_rw
    gid: 10005
    users: []

  - name: workspace_ro
    gid: 10006
    users: []
  - name: workspace_rw
