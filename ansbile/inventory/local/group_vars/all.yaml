---
ansible_ssh_pass: Asdasd11

# Users:          2000-3000
# Service Users:  5000-6000
# Groups:         10000-11000

lock_all_users: false

posix_folders:
  - path: /storage
    owner: root
    group: root
    mode: 770
    acls:
      - { etype: group, entity: storage_ro, perms: rx }
      - { etype: group, entity: storage_rw, perms: rwx }

  - path: /storage/common
    owner: root
    group: root
    mode: 770
    acls:
      - { etype: group, entity: common_ro, perms: rx }
      - { etype: group, entity: common_rw, perms: rwx }

  - path: /storage/common/films
    owner: root
    group: root
    mode: 770
    acls:
      - { etype: group, entity: films_ro, perms: rx }
      - { etype: group, entity: films_rw, perms: rwx }

  - path: /storage/common/isos
    owner: root
    group: root
    mode: 770
    acls:
      - { etype: group, entity: isos_ro, perms: rx }
      - { etype: group, entity: isos_rw, perms: rwx }

  - path: /storage/common/s3
    owner: root
    group: root
    mode: 770
    acls:
      - { etype: group, entity: s3_ro, perms: rx }
      - { etype: group, entity: s3_rw, perms: rwx }

  - path: /storage/common/workspace
    owner: root
    group: root
    mode: 770
    acls:
      - { etype: group, entity: workspace_ro, perms: rx }
      - { etype: group, entity: workspace_rw, perms: rwx }

  - path: /storage/safe
    owner: root
    group: root
    mode: 770
    acls:
      - { etype: group, entity: safe_ro, perms: rx }
      - { etype: group, entity: safe_rw, perms: rwx }

posix_users:
  - uid: 2001
    name: alice
    comment: Alice Anderson
    create_home: true
    password: "Asdasd22"
    shell: /bin/bash
    generate_ssh_key: true
    authorized_keys:
      # axel@ubuntu
      - key: ssh-rsa  axel@ubuntu
        enabled: false
      # peter@osboxes
      - key: ssh-rsa  ansible-generated on osboxes
        enabled: true
    locked: false
    samba_access: true

  - uid: 2002
    name: peter
    comment: Peter Griffin
    create_home: true
    password: "Asdasd22"
    shell: /bin/bash
    generate_ssh_key: true
    authorized_keys:
      - key: ssh-rsa  axel@ubuntu
        enabled: false
    locked: false

  - uid: 5000
    name: su-jellyfin
    comment: Service User - Jellyfin
    create_home: false
    password: "Asdasd22"
    shell: /bin/bash
    locked: false

posix_groups:
