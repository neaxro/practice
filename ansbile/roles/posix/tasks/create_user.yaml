---
- name: "Get group names where {{ user.name }} is a member"
  ansible.builtin.set_fact:
    user_groups: >-
      {{ posix_groups | selectattr('users', 'defined')
                      | selectattr('users', 'contains', user.name)
                      | map(attribute='name')
                      | list }}

- name: "Info: {{ user.name }} groups"
  ansible.builtin.debug:
    msg: "{{ user_groups }}"

- name: "Ensure user {{ user.name }} ({{ user.comment }}) is configured"
  ansible.builtin.user:
    uid: "{{ user.uid }}"
    name: "{{ user.name }}"
    comment: "{{ user.comment }}"
    create_home: "{{ user.create_home }}"
    shell: "{{ user.shell | default('/sbin/nologin') }}"
    groups: >-
      {{ '' if (lock_all_users or (user.locked | default(false)))
         else user_groups }}
    generate_ssh_key: "{{ user.generate_ssh_key | default(false) }}"
    ssh_key_bits: 2048
    password: >-
      {{ '!' if (lock_all_users or (user.locked | default(false)))
         else (user.password | password_hash('sha512')) }}
    state: present

- name: "Set up Authorized keys for user"
  ansible.posix.authorized_key:
    user: "{{ user.name }}"
    key: "{{ public_key.key }}"
    state: "{{ 'present' if public_key.enabled else 'absent' }}"
  loop: "{{ user.authorized_keys }}"
  loop_control:
    loop_var: public_key
  when: user.authorized_keys is defined
