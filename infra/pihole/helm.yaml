---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: mojo2600
  namespace: pihole
spec:
  url: https://mojo2600.github.io/pihole-kubernetes
  interval: 1m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: pihole
spec:
  interval: 1m
  chart:
    spec:
      chart: pihole
      version: 2.34.0
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: pihole
  values:
    replicaCount: 2
    serviceDns:
      type: LoadBalancer
      # loadBalancerIP: "192.168.1.201"
    serviceWeb:
      type: LoadBalancer
    serviceDhcp:
      enabled: false
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - pihole.nemes.local
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
