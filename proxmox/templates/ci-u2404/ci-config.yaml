    ssh_pwauth: true
    passwd: $6$tuL0SaSX2SJJyyFh$Zae2ac0X4vXcyPs.AEOpIEoP6oaXCmnW36gNwfR4sdXd7rbB358DXnK7nv0dG54Yfi5AXQYD7ODjgzUBe/rgM1
    ssh_authorized_keys:
      - "ssh-rsa  axel@ubuntu"
